name: almox

services:
  backend:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    ports:
      - "8082:8000"
    volumes:
      - ./backend:/app
      # caches de ruff/mypy/pytest fora do bind mount (muito mais rápido no Windows/macOS)
      - cache:/cache
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: almox
      POSTGRES_USER: almox
      POSTGRES_PASSWORD: almox
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      CARREGAR_DEMO: "1"
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8082
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: almox
      POSTGRES_USER: almox
      POSTGRES_PASSWORD: almox
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almox -d almox"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://backend:8000
      # eventos de arquivo não atravessam o bind mount no Windows: usa polling
      VITE_POLLING: "1"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  cache:
  db_data:
  frontend_node_modules:
