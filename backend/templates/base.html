{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo_pagina %}Almoxarifado{% endblock %} · CLASSCONT.ALMOX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b523e'/%3E%3Cpath d='M8 13l8-5 8 5v11H8z' fill='none' stroke='%23f5b83d' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'painel/painel.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block classe_body %}bg-slate-50 text-slate-800 antialiased{% endblock %}">
  {% block corpo %}{% endblock %}
  <script>
    // Clique duplo não envia o formulário duas vezes: o segundo envio é barrado e os
    // botões travam. (Se um confirm() cancelou o envio, nada é travado.)
    document.addEventListener('submit', (evento) => {
      const form = evento.target
      if (form.method !== 'post' || evento.defaultPrevented) return
      if (form.dataset.enviando) return evento.preventDefault()
      form.dataset.enviando = '1'
      // Depois do envio sair: um botão desabilitado antes não entraria nos dados do POST
      setTimeout(() => form.querySelectorAll('button[type="submit"]').forEach((b) => (b.disabled = true)))
    })
    // Voltar no navegador restaura a página do cache: destrava
    window.addEventListener('pageshow', () => {
      document.querySelectorAll('form[data-enviando]').forEach((form) => {
        delete form.dataset.enviando
        form.querySelectorAll('button[type="submit"]').forEach((b) => (b.disabled = false))
      })
    })
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
