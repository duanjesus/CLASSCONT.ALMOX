name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: almox
          POSTGRES_USER: almox
          POSTGRES_PASSWORD: almox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U almox" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Pango/HarfBuzz para o WeasyPrint gerar o PDF da guia de saída nos testes
      - name: Bibliotecas do sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - run: pip install -r requirements-dev.txt

      - name: Lint e formatação (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos (mypy + django-stubs)
        run: mypy .

      - name: Checagens do Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Testes (pytest)
        run: pytest --create-db

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
