[project]
name = "classcont-almox"
version = "1.0.0"
description = "Almoxarifado: materiais, entradas, requisições, kardex e fechamento mensal"
requires-python = ">=3.12"

# --- Ruff: lint + formatação (substitui flake8, isort, black) ---
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "DJ",       # boas práticas de Django
    "SIM",      # simplificações
    "C4",       # comprehensions
    "PT",       # estilo do pytest
    "RUF",
]
# RUF001-003: texto em português usa caracteres como "–" e "×" de propósito.
# RUF012: atributos mutáveis de classe (Meta, fields do DRF) são o padrão do Django.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DJ008"]

# --- mypy com os plugins do Django e do DRF ---
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]

# O domínio é Python puro: tipagem estrita
[[tool.mypy.overrides]]
module = "dominio.*"
strict = true

[[tool.mypy.overrides]]
module = ["weasyprint.*", "django_filters.*", "factory.*"]
ignore_missing_imports = true

# Views de CRUD combinam uma classe de configuração (model, form_class...) com as
# CBVs genéricas; o mypy acusa conflito de tipos nesses atributos de classe.
[[tool.mypy.overrides]]
module = ["painel.views.cadastros", "painel.views.materiais"]
disable_error_code = ["misc"]

[tool.django-stubs]
django_settings_module = "config.settings"

# --- pytest ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*"]
