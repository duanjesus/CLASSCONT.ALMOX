<li>
  <a href="{{ url }}"{% if ativo %} aria-current="page"{% endif %}
     class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition {% if ativo %}bg-marca-700 text-white{% else %}hover:bg-marca-700/50 hover:text-white{% endif %}">
    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ icone }}"/></svg>
    <span class="flex-1">{{ rotulo }}</span>
    {% if badge %}<span class="rounded-full bg-destaque px-2 py-0.5 text-xs font-semibold text-marca-900">{{ badge }}</span>{% endif %}
  </a>
</li>
